addEventListener('pointerdown',function(e){down=true;lx=e.clientX;w.style.cursor='grabbing';});
addEventListener('pointermove',function(e){if(!down)return;x+=(e.clientX-lx)*(x<-180?.35:1);lx=e.clientX;set();});
addEventListener('pointerup',function(){down=false;w.style.cursor='grab';});addEventListener('pointercancel',function(){down=false;});
addEventListener('wheel',function(e){x-=(e.deltaX||e.deltaY)*.5;set();},{passive:true});
addEventListener('keydown',function(e){if(e.key=='Escape')history.back();});
spring();
</script></body></html>
